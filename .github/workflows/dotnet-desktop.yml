# CI/CD for AWS S3 File Sync
# - Builds and tests on every push/PR to master
# - On v* tag push (e.g. v1.2.3): publishes a self-contained single-file exe
#   and creates a GitHub Release with the zip attached

name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT:        'FileSyncApp.WinForms/FileSyncApp.WinForms.csproj'
  SOLUTION:       'FileSyncApp.sln'

jobs:
  # -------------------------------------------------
  # CI -- build + test on every push / PR
  # -------------------------------------------------
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Debug)
        run: dotnet build ${{ env.SOLUTION }} -c Debug --no-restore

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'

  # -------------------------------------------------
  # Release -- self-contained publish on v* tag
  # -------------------------------------------------
  release:
    name: Publish & Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Publish win-x64 (self-contained, single-file)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0
          -p:FileVersion=${{ steps.version.outputs.VERSION }}.0
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Add config template to output
        shell: pwsh
        run: Copy-Item FileSyncApp.WinForms/appsettings.template.json publish/win-x64/appsettings.json

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/win-x64/*" `
            -DestinationPath "FileSyncApp-${{ steps.version.outputs.VERSION }}-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FileSyncApp-${{ steps.version.outputs.VERSION }}-win-x64
          path: FileSyncApp-${{ steps.version.outputs.VERSION }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: AWS S3 File Sync v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: FileSyncApp-${{ steps.version.outputs.VERSION }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
